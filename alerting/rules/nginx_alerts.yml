groups:
  - name: nginx_upstream_alerts
    rules:
      - alert: NginxUpstreamDown
        expr: nginx_upstream_server_up == 0
        for: 30s
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "Nginx upstream server is down"
          description: "Upstream {{ $labels.upstream }} server {{ $labels.server }} has been marked down for 30s. Check if max_fails/fail_timeout are configured correctly on this upstream."

      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "High Nginx 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors over the last 5 minutes. Current rate: {{ $value | humanizePercentage }}."

      - alert: NginxUpstreamResponseTimeSlow
        expr: histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: warning
          service: nginx
        annotations:
          summary: "Nginx p95 response time degraded"
          description: "p95 latency is {{ $value }}s, likely caused by an unhealthy upstream still receiving traffic."
