version: "3.8"

services:
  mysql-primary:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    configs:
      - source: mysql_primary_cnf
        target: /etc/mysql/conf.d/custom.cnf
    volumes:
      - mysql_primary_data:/var/lib/mysql
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  mysql-replica:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    configs:
      - source: mysql_replica_cnf_v3_fixed
        target: /etc/mysql/conf.d/custom.cnf
    volumes:
      - mysql_replica_data:/var/lib/mysql
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    configs:
      - source: redis_conf_v3_fixed
        target: /usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - backend
    deploy:
      replicas: 1

  crud-api-1:
    image: crud-api:v1
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: appdb
      REDIS_HOST: redis
    networks:
      - backend
    deploy:
      replicas: 1

  crud-api-2:
    image: crud-api:v1
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: appdb
      REDIS_HOST: redis
    networks:
      - backend
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.27-alpine
    configs:
      - source: nginx_conf_v6_stub
        target: /etc/nginx/nginx.conf
    ports:
      - "8080:80"
    networks:
      - backend
    depends_on:
      - crud-api-1
      - crud-api-2
    deploy:
      replicas: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    configs:
      - source: elasticsearch_yml
        target: /usr/share/elasticsearch/config/elasticsearch.yml
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - backend
    ports:
      - "9200:9200"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    configs:
      - source: logstash_conf_v5_fixed
        target: /usr/share/logstash/pipeline/logstash.conf
      - source: logstash_yml_v2
        target: /usr/share/logstash/config/logstash.yml
    networks:
      - backend
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    configs:
      - source: kibana_yml
        target: /usr/share/kibana/config/kibana.yml
    networks:
      - backend
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    deploy:
      replicas: 1

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command:
      - "--nginx.scrape-uri=http://nginx/stub_status"
    networks:
      - backend
    deploy:
      replicas: 1

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - backend
    deploy:
      replicas: 1

  mysql-exporter-primary:
    image: prom/mysqld-exporter:v0.15.1
    command:
      - "--config.my-cnf=/etc/mysql-exporter/.my.cnf"
    configs:
      - source: exporter_primary_cnf
        target: /etc/mysql-exporter/.my.cnf
    networks:
      - backend
    deploy:
      replicas: 1

  mysql-exporter-replica:
    image: prom/mysqld-exporter:v0.15.1
    command:
      - "--config.my-cnf=/etc/mysql-exporter/.my.cnf"
      - "--collect.slave_status"
    configs:
      - source: exporter_replica_cnf
        target: /etc/mysql-exporter/.my.cnf
    networks:
      - backend
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:v2.53.0
    configs:
      - source: prometheus_yml_v2
        target: /etc/prometheus/prometheus.yml
      - source: nginx_rules
        target: /etc/prometheus/rules/nginx_alerts.yml
      - source: redis_rules
        target: /etc/prometheus/rules/redis_alerts.yml
      - source: mysql_rules
        target: /etc/prometheus/rules/mysql_alerts.yml
      - source: logstash_rules
        target: /etc/prometheus/rules/logstash_alerts.yml
    networks:
      - backend
    ports:
      - "9090:9090"
    deploy:
      replicas: 1

  alertmanager:
    image: prom/alertmanager:v0.27.0
    configs:
      - source: alertmanager_yml
        target: /etc/alertmanager/alertmanager.yml
    networks:
      - backend
    ports:
      - "9093:9093"
    deploy:
      replicas: 1

networks:
  backend:
    driver: overlay

volumes:
  mysql_primary_data:
  mysql_replica_data:
  es_data:

configs:
  mysql_primary_cnf:
    file: ../roles/mysql/files/my-primary.cnf
  mysql_replica_cnf_v3_fixed:
    file: ../roles/mysql/files/my-replica.cnf
  redis_conf_v3_fixed:
    file: ../roles/redis/files/redis.conf
  nginx_conf_v6_stub:
    file: ../roles/nginx/files/nginx.conf
  elasticsearch_yml:
    file: ../roles/elk/files/elasticsearch.yml
  logstash_conf_v5_fixed:
    file: ../roles/elk/files/logstash.conf
  logstash_yml_v2:
    file: ../roles/elk/files/logstash.yml
  kibana_yml:
    file: ../roles/elk/files/kibana.yml
  prometheus_yml_v2:
    file: ../alerting/prometheus/prometheus.yml
  nginx_rules:
    file: ../alerting/rules/nginx_alerts.yml
  redis_rules:
    file: ../alerting/rules/redis_alerts.yml
  mysql_rules:
    file: ../alerting/rules/mysql_alerts.yml
  logstash_rules:
    file: ../alerting/rules/logstash_alerts.yml
  alertmanager_yml:
    file: ../alerting/alertmanager/alertmanager.yml
  exporter_primary_cnf:
    file: ../roles/mysql/files/exporter-primary.cnf
  exporter_replica_cnf:
    file: ../roles/mysql/files/exporter-replica.cnf
