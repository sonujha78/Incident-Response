input {
  tcp {
    port => 5000
    codec => json_lines
  }
}
filter {
  mutate {
    add_field => { "environment" => "production" }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
